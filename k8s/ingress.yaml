apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: rexwithluv-dev
  name: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: rexwithluv-dev-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - pathType: Exact
            path: /
            backend:
              service:
                name: service
                port:
                  number: 80
