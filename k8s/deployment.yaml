apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: rexwithluv-dev
  name: rexwithluv-dev
  labels:
    app: rexwithluv-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rexwithluv-dev
  template:
    metadata:
      labels:
        app: rexwithluv-dev
    spec:
      containers:
        - name: rexwithluv-dev
          image: ghcr.io/rexwithluv/rexwithluv-dev:2.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: '64Mi'
              cpu: '50m'
            limits:
              memory: '128Mi'
              cpu: '100m'
