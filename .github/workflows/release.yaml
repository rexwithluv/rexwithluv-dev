name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # GitHub rechaza a veces el push de refs/notes/semantic-release-* después
      # de crear la etiqueta y la release se queda a medias. Esas notas solo
      # guardan los canales (beta, next...), que aquí no se usan: se omite ese push.
      - name: Skip semantic-release notes push
        run: |
          mkdir -p "$RUNNER_TEMP/gitshim"
          cat > "$RUNNER_TEMP/gitshim/git" <<EOF
          #!/usr/bin/env bash
          if [ "\$1" = push ] && [[ "\$*" == *refs/notes/semantic-release* ]]; then
            echo "Skipping notes push: \$*" >&2
            exit 0
          fi
          exec $(command -v git) "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/gitshim/git"
          echo "$RUNNER_TEMP/gitshim" >> "$GITHUB_PATH"

      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Versiones fijadas: conventionalcommits@10 necesita un writer que
          # semantic-release todavía no trae
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@9

      # Versión a publicar: la nueva, o la etiqueta que ya tenga este commit
      # (al relanzar un workflow que falló después de etiquetar)
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
        run: |
          if [ -n "$NEW_VERSION" ]; then
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force
          TAG=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "No new version"
            exit 0
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Apunta k8s/deployment.yaml a la imagen recién publicada. El push con
  # GITHUB_TOKEN no vuelve a lanzar workflows, y al ser chore no saca versión.
  bump-k8s:
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Update image tag
        env:
          VERSION: ${{ needs.release.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          sed -i -E "s|(image: ${IMAGE}):[^[:space:]]+|\1:${VERSION}|" k8s/deployment.yaml
          grep -q "image: ${IMAGE}:${VERSION}$" k8s/deployment.yaml || {
            echo "No se encontró la línea image en k8s/deployment.yaml" >&2
            exit 1
          }

      - name: Commit and push
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "k8s ya apunta a ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(k8s): deploy image ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
