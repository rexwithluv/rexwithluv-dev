name: Claude

on:
  # Review automática
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Si la PR solo toca Markdown no se revisa
    paths-ignore:
      - '**.md'
  # Bajo demanda: escribir @claude en un comentario
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # Si llegan varios pushes seguidos, solo se revisa el último
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Revisa esta PR y escribe en español, con tono cercano y sin emojis.

            Contexto del proyecto: portfolio personal en SvelteKit (adapter-static, Svelte 5 con runes,
            Tailwind 4), traducido con svelte-i18n a es, gl y en. Se sirve con nginx en una imagen Docker
            y se despliega en K3s con los manifiestos de k8s/. Las versiones las saca semantic-release
            a partir de Conventional Commits.

            Fíjate sobre todo en:
            - Fallos reales: lógica, rutas rotas, problemas con el base path o con el build estático.
            - Traducciones: que toda clave nueva o cambiada exista en los tres idiomas (src/locales).
            - Accesibilidad: el sitio cumple WCAG 2.2 AA; avisa de contraste, foco, alt, lang, etc.
            - Manifiestos de k8s/: imagen y etiqueta, sondas, recursos, selectores y labels coherentes.
              Ojo: la línea image de k8s/deployment.yaml la actualiza el CI tras cada release; no
              hace falta subirla a mano en la PR, y si alguien lo hace, avísalo.
            - Workflows de .github/: permisos mínimos y secretos bien usados.
            - Commits: si el tipo (feat, fix, chore...) no encaja con el cambio, dilo, porque decide la versión.

            No comentes cosas de estilo que ya arregla Prettier. Si no ves nada importante, dilo en
            una línea en vez de rellenar.

            Usa mcp__github_inline_comment__create_inline_comment para comentar líneas concretas
            y `gh pr comment` para el resumen general.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
